<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Traverse Globe - Your Travel Partner</title>
    <meta name="title" content="Traverse Globe - Your Travel Partner" />
    <meta name="description" content="Traverse Globe is your trusted travel partner for curated holiday packages, seamless bookings, and unforgettable experiences across UAE, Bali, Thailand, Singapore, and more." />
    <meta name="theme-color" content="#FF5B04" />

    <!-- Resolve the theme before the first paint. Runs synchronously and deliberately
         ahead of the stylesheet so there is no flash of the wrong theme.
         Keep the storage key and values in sync with src/components/revamp/ThemeToggle.jsx. -->
    <script>
      (function () {
        try {
          // Dark is the site default: anything other than an explicit 'light' is dark.
          var stored = localStorage.getItem('tg_theme');
          var dark = stored !== 'light';
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0c1119' : '#FF5B04');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        // The pre-rendered markup in #root is the homepage; see the script after #root.
        if (location.pathname !== '/') document.documentElement.setAttribute('data-route-other', '');
      })();
    </script>
    <!-- NUCLEAR CACHE BUSTER -->
    <script>
      if (!localStorage.getItem('cache_busted_v2')) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
              registration.unregister();
              console.log('Unregistered rogue service worker:', registration);
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (let name of names) {
              caches.delete(name);
            }
          });
        }
        localStorage.setItem('cache_busted_v2', 'true');
      }
    </script>
    
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="apple-touch-icon" href="/logo.webp" />
    
    <!-- DNS Prefetch for faster third-party connections -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <link rel="dns-prefetch" href="https://cdn.sanity.io" />
    
    <!-- Preconnect ONLY to most critical origins (limit to 4). cdn.sanity.io serves only
         below-the-fold native image assets, so it gets the dns-prefetch above instead.
         Fonts are self-hosted, so they need no connection of their own. -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://xe1685rk.apicdn.sanity.io" crossorigin />
    
    <!-- LCP hero image. These URLs must be exactly what buildSrcSet(HERO_IMAGE, { widths: HERO_WIDTHS })
         produces in src/components/HeroSection.jsx; any mismatch and the browser downloads both.
         No fm=: Unsplash's auto=format picks AVIF/WebP/JPEG from the Accept header. -->
    <link rel="preload" as="image" fetchpriority="high"
          href="/hero-desert-group.png?w=960&q=60&auto=format&fit=crop"
          imagesrcset="/hero-desert-group.png?w=640&q=60&auto=format&fit=crop 640w, /hero-desert-group.png?w=768&q=60&auto=format&fit=crop 768w, /hero-desert-group.png?w=960&q=60&auto=format&fit=crop 960w, /hero-desert-group.png?w=1280&q=60&auto=format&fit=crop 1280w, /hero-desert-group.png?w=1920&q=60&auto=format&fit=crop 1920w"
          imagesizes="100vw" />

  <!-- Critical inline CSS for above-the-fold content -->
    <style>
      /* Critical CSS - inline for immediate render */
      *,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
      html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif}
      body{margin:0;font-family:inherit;line-height:inherit}
      #root{min-height:100vh}
      /* Values are inlined rather than read from CSS variables so the skeleton is
         correct even before the main stylesheet arrives. The hero itself carries a dark
         scrim in both themes, so boot-hero stays dark either way. */
      .boot{min-height:100vh;background:#f8fafc}
      :root[data-theme="dark"] .boot{background:#0c1119}
      .boot-hero{height:72vh;min-height:420px;background:#16232A;background-image:linear-gradient(100deg,#16232A 0%,#1f333d 50%,#16232A 100%);background-size:200% 100%;animation:bootShimmer 1.4s ease-in-out infinite}
      @keyframes bootShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
      @media (prefers-reduced-motion:reduce){.boot-hero{animation:none}}
      /* Never paint the pre-rendered homepage on another URL (swapped out after #root). */
      [data-route-other] #root[data-prerendered]{visibility:hidden}
    </style>
    
    <!-- Self-hosted fonts (@font-face in src/index.css). Preload only the faces the
         pre-rendered hero paints with, so its first paint is usually already in the real
         fonts and the swap cannot shift the hero (that swap was PageSpeed's CLS culprit).
         Keep these paths in sync with public/fonts and the @font-face rules. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-500-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-600-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-700-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-var-latin.woff2" crossorigin />
    
    <!-- Third-party tag loader. GTM and the Meta Pixel cost ~0.9s of main thread on a
         mid-range phone, and they used to run while the page itself was booting. Their
         queues (dataLayer, fbq) are created immediately below, so every event pushed
         before the libraries arrive is kept and replayed; only the library downloads
         wait until the page has loaded and the main thread is idle. -->
    <script>
      window.__loadThirdParty = function (src) {
        var run = function () {
          var j = document.createElement('script');
          j.async = true;
          j.src = src;
          document.head.appendChild(j);
        };
        var whenIdle = function () {
          if ('requestIdleCallback' in window) requestIdleCallback(run, { timeout: 2500 });
          else setTimeout(run, 1500);
        };
        if (document.readyState === 'complete') whenIdle();
        else window.addEventListener('load', whenIdle);
      };
    </script>

    <!-- Google Tag Manager (library deferred via __loadThirdParty) -->
    <script>(function(w,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var dl=l!='dataLayer'?'&l='+l:'';
w.__loadThirdParty('https://www.googletagmanager.com/gtm.js?id='+i+dl);
})(window,'dataLayer','GTM-WZWV7ZQ7');</script>
    <!-- End Google Tag Manager -->
    
    <!-- Meta Pixel managed via Google Tag Manager -->
    
  <!-- Modulepreload is omitted to avoid any non-standard data: fallback in strict CSP contexts; Vite handles this in production build -->
    
    <!-- Cookie Control - Block third-party cookies early -->
    <script type="module" src="/src/utils/cookieControl.js"></script>
    <!-- Meta Pixel Code (pixel 814339692478366; GTM loads a second, different pixel).
         Standard stub, with the fbevents.js download deferred via __loadThirdParty. -->
    <script>
    !function(f,v,n)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];f.__loadThirdParty(v)}(window,
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '814339692478366');
    fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <!-- Meta Pixel Code (noscript) -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=814339692478366&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code (noscript) -->
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WZWV7ZQ7"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <!-- Meta Pixel is injected by GTM; noscript tracking omitted to prevent duplication -->
    
    <!-- Boot skeleton sized to the hero so first paint does not shift.
         On build, scripts/prerender.mjs replaces everything between the app-root markers
         with <div id="root" data-prerendered> holding the server-rendered homepage
         (header + hero), which main.jsx then hydrates. -->
    <!--app-root-->
    <div id="root">
      <div class="boot">
        <div class="boot-hero"></div>
      </div>
    </div>
    <!--/app-root-->

    <!-- Every URL is served this same file, but only "/" may use the pre-rendered
         homepage. Anywhere else, swap it for the boot skeleton before React starts
         (the data-route-other rule in <head> keeps it from painting meanwhile). -->
    <script>
      (function () {
        var root = document.getElementById('root');
        if (!root.hasAttribute('data-prerendered') || location.pathname === '/') return;
        root.removeAttribute('data-prerendered');
        var boot = document.createElement('div');
        boot.className = 'boot';
        var hero = document.createElement('div');
        hero.className = 'boot-hero';
        boot.appendChild(hero);
        root.replaceChildren(boot);
      })();
    </script>

    <!-- Main app script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
