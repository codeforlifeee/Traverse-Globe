<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Traverse Globe - Your Travel Partner</title>
    <meta name="title" content="Traverse Globe - Your Travel Partner" />
    <meta name="description" content="Traverse Globe is your trusted travel partner for curated holiday packages, seamless bookings, and unforgettable experiences across UAE, Bali, Thailand, Singapore, and more." />
    <meta name="theme-color" content="#FF5B04" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="apple-touch-icon" href="/logo.webp" />
    
    <!-- DNS Prefetch for faster third-party connections -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
    
    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    
    <!-- Critical inline CSS for above-the-fold content -->
    <style>
      /* Critical CSS - inline for immediate render */
      *,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
      html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif}
      body{margin:0;font-family:inherit;line-height:inherit}
      #root{min-height:100vh}
      .loading-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#fff}
      .spinner{width:48px;height:48px;border:4px solid #f3f3f3;border-top:4px solid #FF5B04;border-radius:50%;animation:spin 1s linear infinite}
      @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    </style>
    
    <!-- Optimized fonts with font-display: swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" />
    </noscript>
    
    <!-- Google Tag Manager - Load async -->
    <script>
      (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
      new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','GTM-NMGSJNRJ');
    </script>
    
    <!-- Preload main JS module -->
    <link rel="modulepreload" href="/src/main.jsx" />
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NMGSJNRJ" height="0" width="0" style="display:none;visibility:hidden"></iframe>
    </noscript>
    
    <!-- Loading screen -->
    <div id="root">
      <div class="loading-screen">
        <div class="spinner"></div>
      </div>
    </div>
    
    <!-- Main app script -->
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Defer Font Awesome loading -->
    <script>
      // Load Font Awesome on user interaction or after 3s
      const loadFA = () => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
        link.crossOrigin = 'anonymous';
        document.head.appendChild(link);
      };
      
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadFA, { timeout: 3000 });
      } else {
        setTimeout(loadFA, 3000);
      }
      
      // Also load on first interaction
      ['mousedown', 'touchstart', 'keydown', 'scroll'].forEach(event => {
        window.addEventListener(event, loadFA, { once: true, passive: true });
      });
    </script>
  </body>
</html>
