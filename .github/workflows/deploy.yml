name: Deploy to Hostinger via FTP
on:
  push:
    branches: [ main, feature/complete-frontend-revamp ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Write deployment version info
        run: |
          echo "commit=${{ github.sha }}" > dist/version.txt
          echo "branch=${{ github.ref_name }}" >> dist/version.txt
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> dist/version.txt

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          server-dir: /
          local-dir: ./dist/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            **/README.md

      - name: Bust CDN cache
        run: |
          echo "Waiting 10s for FTP sync to propagate..."
          sleep 10
          echo "Sending cache-bust requests to traverseglobe.com..."
          curl -sI -H "Cache-Control: no-cache" -H "Pragma: no-cache" "https://traverseglobe.com/" -o /dev/null -w "HTTP Status: %{http_code}\n"
          curl -sI -H "Cache-Control: no-cache" -H "Pragma: no-cache" "https://www.traverseglobe.com/" -o /dev/null -w "HTTP Status: %{http_code}\n"
          echo "Cache-bust requests sent!"
